# Fly.io config. Change `app` to a unique name. One machine only: SQLite lives on a single volume.
app = "msc-jrdp"
primary_region = "ord"

[build]

[env]
  MSC_DB = "/data/msc.sqlite"
  PORT = "8080"

[mounts]
  source = "msc_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
